<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FIRST SCREEN
    ========================== -->

    <main id="welcomeScreen" class="screen">

        <div class="stars"></div>

        <div class="welcome-content">

            <button id="startButton" class="heart-button">
                ❤️
            </button>

            <h1>Click Me</h1>

            <p>A little surprise is waiting for you... 🌸</p>

        </div>

    </main>


    <!-- =========================
         FLOWER SCREEN
    ========================== -->

    <section id="flowerScreen" class="screen hidden">

        <div id="flowerContainer"></div>

    </section>

    <!-- BACKGROUND MUSIC -->

<audio id="backgroundMusic" loop preload="auto">
    <source src="assets/music/our-song.mp3" type="audio/mpeg">
</audio>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
