<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FIRST SCREEN
    ========================== -->

    <main id="welcomeScreen" class="screen">

        <div class="stars"></div>

        <div class="welcome-content">

            <button id="startButton" class="heart-button">
                ❤️
            </button>

            <h1>Click Me</h1>

            <p>A little surprise is waiting for you... 🌸</p>

        </div>

    </main>


    <!-- =========================
         FLOWER SCREEN
    ========================== -->

    <section id="flowerScreen" class="screen hidden">

        <div id="flowerContainer"></div>

    </section>

    <!-- BACKGROUND MUSIC -->

<audio id="backgroundMusic" loop preload="auto">
    <source src="assets/music/our-song.mp3" type="audio/mpeg">
</audio>

    <!-- =========================
     CUTE COUPLE SCREEN
========================== -->

<section id="coupleScreen" class="screen hidden">

    <div class="couple-background">

        <!-- Floating Hearts -->
        <div class="floating-heart heart-one">💗</div>
        <div class="floating-heart heart-two">💕</div>
        <div class="floating-heart heart-three">💖</div>
        <div class="floating-heart heart-four">💗</div>
        <div class="floating-heart heart-five">💞</div>

        <div class="couple-content">

            <!-- Cute Bunny Couple -->

            <div class="couple-bunnies">

                <div class="bunny bunny-left">
                    🐰
                </div>

                <div class="love-between">
                    💕
                </div>

                <div class="bunny bunny-right">
                    🐰
                </div>

            </div>


            <h2>One more little surprise... 💕</h2>

            <p>
                Because you deserve all the cute things in the world.
            </p>


            <!-- Couple Click Button -->

            <button id="coupleButton" class="small-heart-button">

                <span class="button-heart">❤️</span>

                <span class="button-text">
                    Click Me
                </span>

            </button>

        </div>

    </div>

</section>
    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
